; Classic ESP32 (ESP32-WROOM / ESP32-DevKitC) + I2S mic (INMP441-style)
; Pinned to Arduino core 2.0.x (IDF 4.4) because the firmware uses the
; classic <driver/i2s.h> API.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Flaky USB-serial chip / upload fails to sync? Lower this to 115200.

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -O2

lib_deps =
    links2004/WebSockets@^2.4.1
    rfetick/MPU6050_light@^1.1.0

; ESP32-S3 board instead? Use:
;   board = esp32-s3-devkitc-1
; and, if it enumerates on the native "USB" port (not "UART"), also add:
;   -DARDUINO_USB_CDC_ON_BOOT=1